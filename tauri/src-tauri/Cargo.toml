[package]
name = "work_match"
version = "0.1.0"
description = "work-match tray app"
edition = "2021"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin (cargo#8519 on Windows).
name = "work_match_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
window-vibrancy = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Stays on 0.31: it shares libsqlite3-sys 0.28 with tauri-plugin-sql's sqlx.
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-shell = "2"
# Opens the Jitsi call (match_popup.rs) in the default browser.
tauri-plugin-opener = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "time", "sync"] }
# The deployed backend (yarn prod -> https://work-match-api.vercel.app) needs
# HTTPS; without a TLS backend every poll and push fails, so no match popups.
# The TLS backend is picked per OS below (rustls on macOS, Windows' own on Windows).
reqwest = { version = "0.13", default-features = false, features = ["json"] }
regex = "1"
url = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# collecting_data/app_tracker.rs: focused window title + document via Accessibility.
accessibility-sys = "0.2"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
# native-tls = Windows' built-in TLS (SChannel): nothing extra to install,
# unlike rustls' aws-lc, which needs NASM/CMake to build on Windows.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Same version Tauri already uses. app_tracker.rs: foreground app + window
# title; llm.rs: a job object so llama-server dies with the app; lib.rs:
# rounded corners on the match popup.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
