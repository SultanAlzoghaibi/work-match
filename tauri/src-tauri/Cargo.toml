[package]
name = "work_match"
version = "0.1.0"
description = "work-match tray app"
edition = "2021"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin (cargo#8519 on Windows).
name = "work_match_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
window-vibrancy = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Stays on 0.31: it shares libsqlite3-sys 0.28 with tauri-plugin-sql's sqlx.
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-shell = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "time", "sync"] }
# Only talks to llama-server on 127.0.0.1, so no TLS backend. The backend push will need `rustls`.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
regex = "1"
url = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# collecting_data/app_tracker.rs: focused window title + document via Accessibility.
accessibility-sys = "0.2"
core-foundation = "0.10"
