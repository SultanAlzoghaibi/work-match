<svg viewBox="0 0 1200 580" width="1200" height="580" xmlns="http://www.w3.org/2000/svg">
  <style>
svg text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6eaf2; }
.z-mine { fill: #2a1e3d; stroke: #c39cf5; stroke-width: 2; stroke-dasharray: 8 6; }
.z-local { fill: #15302a; stroke: #4fc79c; stroke-width: 2; stroke-dasharray: 8 6; }
.z-cloud { fill: #182544; stroke: #7ea6ff; stroke-width: 2; stroke-dasharray: 8 6; }
.zt { font-weight: 800; font-size: 19px; letter-spacing: 0.08em; }
.zt-mine { fill: #c39cf5; }
.zt-local { fill: #4fc79c; }
.zt-cloud { fill: #7ea6ff; }
.zs { fill: #9aa4b8; font-weight: 500; font-size: 15px; }
.box { fill: #171e2a; stroke: #334055; stroke-width: 1.5; }
.box-key { fill: #171e2a; stroke: #4fc79c; stroke-width: 3; }
.box-cloud { fill: #171e2a; stroke: #7ea6ff; stroke-width: 1.5; }
.t { font-weight: 700; font-size: 21px; }
.tech { fill: #9aa4b8; font-weight: 500; font-size: 15px; }
.blocked { fill: #f08a6c; font-weight: 700; font-size: 15px; }
.arrow { stroke: #9aa4b8; stroke-width: 2; fill: none; }
.arrow-key { stroke: #4fc79c; stroke-width: 4; fill: none; }
.ah { fill: #9aa4b8; }
.ah-key { fill: #4fc79c; }
.cross { fill: #4fc79c; font-weight: 800; font-size: 14px; letter-spacing: 0.04em; }
  </style>
  <rect width="1200" height="580" fill="#0f141d"/>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
        <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-key" d="M0 0L10 5L0 10z"/></marker>
      </defs>

      <!-- Zone 1: my data -->
      <rect class="z-mine" x="10" y="10" width="320" height="560" rx="18"/>
      <text class="zt zt-mine" x="170" y="50" text-anchor="middle">MY DATA</text>
      <text class="zs" x="170" y="72" text-anchor="middle">what I'm working on</text>

      <rect class="box" x="35" y="170" width="270" height="90" rx="12"/>
      <text class="t" x="170" y="208" text-anchor="middle">Chrome tabs</text>
      <text class="tech" x="170" y="238" text-anchor="middle">Chrome extension</text>

      <rect class="box" x="35" y="330" width="270" height="90" rx="12"/>
      <text class="t" x="170" y="368" text-anchor="middle">Apps &amp; windows</text>
      <text class="tech" x="170" y="398" text-anchor="middle">app tracker (Rust)</text>

      <!-- Zone 2: stored on my laptop -->
      <rect class="z-local" x="380" y="10" width="440" height="560" rx="18"/>
      <text class="zt zt-local" x="600" y="50" text-anchor="middle">🔒 STORED ON MY LAPTOP</text>
      <text class="zs" x="600" y="72" text-anchor="middle">Tauri app · never uploaded</text>

      <rect class="box" x="410" y="92" width="380" height="90" rx="12"/>
      <text class="t" x="600" y="130" text-anchor="middle">Privacy filter</text>
      <text class="blocked" x="600" y="160" text-anchor="middle">✕ email · banking · health · messages</text>

      <rect class="box" x="410" y="210" width="380" height="90" rx="12"/>
      <text class="t" x="600" y="248" text-anchor="middle">Local buffer</text>
      <text class="tech" x="600" y="278" text-anchor="middle">SQLite · cleared in ~6 min</text>

      <rect class="box" x="410" y="328" width="380" height="90" rx="12"/>
      <text class="t" x="600" y="366" text-anchor="middle">Llama 3.2 3B, on device</text>
      <text class="tech" x="600" y="396" text-anchor="middle">llama.cpp · no cloud AI</text>

      <rect class="box-key" x="410" y="446" width="380" height="96" rx="12"/>
      <text class="t" x="600" y="486" text-anchor="middle">Short summary</text>
      <text class="tech" x="600" y="516" text-anchor="middle">topic · focus · task summary</text>

      <!-- Zone 1 into the filter -->
      <path class="arrow" d="M305 215H350V137H404" marker-end="url(#a)"/>
      <path class="arrow" d="M305 375H350V137"/>

      <path class="arrow" d="M600 182V204" marker-end="url(#a)"/>
      <path class="arrow" d="M600 300V322" marker-end="url(#a)"/>
      <path class="arrow" d="M600 418V440" marker-end="url(#a)"/>

      <!-- Zone 3: server -->
      <rect class="z-cloud" x="870" y="10" width="320" height="560" rx="18"/>
      <text class="zt zt-cloud" x="1030" y="50" text-anchor="middle">SERVER</text>
      <text class="zs" x="1030" y="72" text-anchor="middle">stored &amp; output</text>

      <rect class="box-cloud" x="895" y="446" width="270" height="96" rx="12"/>
      <text class="t" x="1030" y="486" text-anchor="middle">Stores my summary</text>
      <text class="tech" x="1030" y="516" text-anchor="middle">FastAPI (Vercel) · Supabase</text>

      <rect class="box-cloud" x="895" y="270" width="270" height="90" rx="12"/>
      <text class="t" x="1030" y="308" text-anchor="middle">Finds a match</text>
      <text class="tech" x="1030" y="338" text-anchor="middle">Jev decision model</text>

      <rect class="box-cloud" x="895" y="100" width="270" height="90" rx="12"/>
      <text class="t" x="1030" y="138" text-anchor="middle">Triggers call</text>
      <text class="tech" x="1030" y="168" text-anchor="middle">via Jitsi</text>

      <path class="arrow" d="M1030 446V366" marker-end="url(#a)"/>
      <path class="arrow" d="M1030 270V196" marker-end="url(#a)"/>

      <!-- The one crossing -->
      <path class="arrow-key" d="M790 494H889" marker-end="url(#ak)"/>
      <text class="cross" x="845" y="470" text-anchor="middle">ONLY THIS</text>
      <text class="cross" x="845" y="526" text-anchor="middle">LEAVES</text>
      <text class="tech" x="845" y="548" text-anchor="middle">HTTPS</text>
    </svg>
