# Render Blueprint: the work-match API (backend/app). Render reads this file
# when you create a Blueprint from the repo. Secrets (sync: false) are
# entered in the Render dashboard, never committed.
services:
  - type: web
    name: work-match-api
    runtime: python
    plan: free
    region: oregon            # same AWS region as the Supabase project (us-west-2)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL       # Supabase > Connect > Session pooler URI
        sync: false
      - key: OPENROUTER_API_KEY # empty = topic-overlap fallback instead of Jev
        sync: false
      - key: JEV_MODEL
        value: typesafe/jev-1.14
      - key: MATCH_THRESHOLD
        value: "0.7"
      - key: INTERRUPT_THRESHOLD
        value: "0.5"
